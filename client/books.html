<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books — Library Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>


  <header class="hero">
    <nav class="nav container">
      <a href="index.html" class="brand">Library Management</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="books.html" class="nav-link">Books</a>
        <a href="members.html" class="nav-link">Members</a>
        <a href="borrowings.html" class="nav-link">Borrowings</a>
        <a href="categories.html" class="nav-link">Categories</a>
      </div>
    </nav>

    <section id="home" class="container hero-body">
      <p class="eyebrow">Dashboard</p>
      <div id="api-status" class="api-status" hidden></div>
    </section>
  </header>

  <main class="container main">

    <section id="books" class="section">
      <div class="section-head">
        <div>
          <h2>Books</h2>
          <p>Every title in the catalogue, with copies available.</p>
        </div>
        <div class="actions">
          <label class="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span class="sr-only">Search books</span>
            <input type="search" id="book-search" placeholder="Search title or author">
          </label>
          <button type="button" class="btn btn-primary" data-open="book-dialog">+ Add book</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Copies</th><th><span class="sr-only">Actions</span></th></tr>
          </thead>
          <tbody id="books-body"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>

  </main>

  <dialog id="book-dialog" class="dialog">
    <form method="dialog" id="book-form" class="dialog-form">
      <h3>Add a book</h3>
      <label>Title<input name="title" required></label>
      <label>Author<input name="author" required></label>
      <label>ISBN<input name="isbn" required></label>
      <div class="row">
        <label>Category
          <select name="category_id" id="book-category"><option value="">Uncategorised</option></select>
        </label>
        <label>Copies<input name="copies" type="number" min="0" value="1" required></label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save book</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
